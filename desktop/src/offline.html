<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveGrade - Connection Lost</title>
<style>
  :root {
    --brand-deep: #1b4f8a;
    --brand-bright: #2e86de;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    padding: 24px;
  }
  .card {
    max-width: 440px;
    width: 100%;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }
  .badge {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    margin: 0 auto 16px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--brand-deep), var(--brand-bright));
    font-size: 24px;
    font-weight: 800;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: #cbd5e1; margin: 0 0 22px; line-height: 1.5; }
  button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--brand-deep), var(--brand-bright));
    cursor: pointer;
  }
  button:hover { opacity: 0.94; }
  .status { margin-top: 12px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">LG</div>
    <h1>Waiting for connection</h1>
    <p>LiveGrade could not reach <strong>livegrade.gilgaltech.com</strong>. Your cloud session stays active and will resume automatically once connected.</p>
    <button id="retry-btn" type="button">Retry now</button>
    <div class="status" id="status-text">Checking connection...</div>
  </div>
  <script>
    const btn = document.getElementById('retry-btn');
    const statusText = document.getElementById('status-text');
    btn.addEventListener('click', () => {
      statusText.textContent = 'Reconnecting...';
      if (window.livegradeDesktop) {
        window.livegradeDesktop.retryConnection();
      } else {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
