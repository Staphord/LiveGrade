title = "LiveGrade gitleaks"

[extend]
useDefault = true

# [[allowlists]] replaced [allowlist] in gitleaks v8.25.0.
[[allowlists]]
description = "Local tooling and generated output, never committed"
paths = ['''venv/''', '''security/\.tools-venv/''', '''security/reports/''']

[[allowlists]]
description = "Test fixture passes key= as a plain argument, not a credential"
paths = ['''assessments/tests/test_coverage_edges\.py''']
