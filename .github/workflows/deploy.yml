name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # LiveGrade's suite needs no Postgres, Redis or network: SQLite, in-memory
    # channels and in-process Celery are switched on by settings when running tests.
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - name: Deployment tooling tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run tests
        run: |
          set -o pipefail
          coverage run manage.py test --parallel 2>&1 | tee test.log
      # .coveragerc enforces fail_under = 100.
      - name: Coverage gate
        run: coverage combine && coverage report
      - name: Job summary
        if: always()
        run: |
          coverage combine >/dev/null 2>&1 || true
          coverage json -o cov.json -q || true
          python scripts/ci_summary.py test test.log cov.json >> "$GITHUB_STEP_SUMMARY"
