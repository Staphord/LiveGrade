name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # LiveGrade's suite needs no Postgres, Redis or network: SQLite, in-memory
    # channels and in-process Celery are switched on by settings when running tests.
    env:
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: |
          set -o pipefail
          coverage run manage.py test --parallel 2>&1 | tee test.log
      # .coveragerc enforces fail_under = 100.
      - name: Coverage gate
        run: coverage combine && coverage report
      - name: Job summary
        if: always()
        run: |
          coverage combine >/dev/null 2>&1 || true
          coverage json -o cov.json -q || true
          python scripts/ci_summary.py test test.log cov.json >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy
        run: |
          set -o pipefail
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.VPS_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "APP_DIR='${{ secrets.VPS_APP_DIR }}' SERVICES='${{ secrets.VPS_SERVICES }}' bash -s" \
            < scripts/deploy.sh 2>&1 | tee deploy.log
      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/ci_summary.py deploy deploy.log >> "$GITHUB_STEP_SUMMARY"
