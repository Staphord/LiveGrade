name: CodeQL

on:
  push:
    branches: [main, ci/deploy-pipeline]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

# Nothing here needs to write to the repository; the jobs below ask for exactly what they use.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  # Not a check: one summary for the whole run, listing the open alerts of this branch with what
  # each means and where it is (analyze waits for GitHub to process its results, so they are current).
  report:
    if: always()
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read this branch's open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          mkdir -p out
          gh api "repos/$REPO/code-scanning/alerts?state=open&ref=$REF&per_page=100" --paginate --slurp > alerts.json \
            || echo '{"error": "could not read the alerts"}' > alerts.json
      # Values go through env, never straight into the script.
      - name: Summary
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          SUMMARY_TITLE: CodeQL code scanning
        run: |
          python3 security/summary.py section codeql alerts.json > out/codeql.md
          NEEDS_JSON="{\"codeql\": {\"result\": \"$ANALYZE_RESULT\"}}" python3 security/summary.py overview out >> "$GITHUB_STEP_SUMMARY"
