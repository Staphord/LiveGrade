<style nonce="{{ csp_nonce }}">

  .tc-rank-input{max-width:9rem}

  main.tc-workspace .tc-panel :focus-visible,main.tc-workspace .tc-list-card:focus-visible,main.tc-workspace .tc-step-nav a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .tc-results-header{padding:clamp(1.1rem,3vw,2rem);border:1px solid var(--border);border-radius:var(--radius-card-lg);background:linear-gradient(135deg,var(--accent-soft),var(--surface));box-shadow:var(--elev-1);color:var(--text)}
  .tc-results-header-top{display:flex;align-items:center;flex-wrap:wrap;gap:.65rem;margin-bottom:1rem}

  .tc-results-header h1{margin:0;color:var(--ink);font-size:clamp(1.65rem,4vw,2.65rem);line-height:1.12;overflow-wrap:anywhere}
  .tc-results-meta{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.85rem;color:var(--text-muted);font-size:var(--fs-sm);font-weight:600}

  .tc-results-availability{margin:.75rem 0 0;padding:.7rem .85rem;border:1px solid var(--border);border-radius:var(--radius-control);background:var(--surface);color:var(--text-soft);font-size:var(--fs-sm);font-weight:650}

  .tc-results-track-header h2{font-size:clamp(1.1rem,2.2vw,1.45rem);overflow-wrap:anywhere}

  .tc-results-badge.is-winner-badge{background:var(--accent-soft);color:var(--accent)}
  .tc-results-badge.is-tie-badge{background:var(--tone-warn-bg);color:var(--tone-warn-fg)}

  .tc-results-meter::-webkit-progress-value{border-radius:var(--radius-pill);background:var(--accent);transition:width var(--motion) var(--ease)}
  .tc-results-meter::-moz-progress-bar{border-radius:var(--radius-pill);background:var(--accent)}

  .tc-results-breakdown ul{display:grid;gap:.25rem;margin:.45rem 0 0;padding-left:1.2rem}
  .tc-results-breakdown li{overflow-wrap:anywhere}
  .tc-results-score{display:flex;flex-direction:column;align-items:flex-end;gap:.15rem;color:var(--ink);font-size:clamp(1.15rem,2.1vw,1.55rem);font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tc-results-score small{color:var(--text-muted);font-size:var(--fs-micro);font-weight:650}
  @keyframes tc-results-appear{from{opacity:0;transform:translateY(.3rem)}to{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.tc-results-track{animation:none}.tc-results-meter::-webkit-progress-value{transition:none}}
  @media(max-width:767.98px){.tc-hero{display:block}.tc-hero>.tc-status{margin-top:.85rem}.tc-panel>header{display:block}.tc-history li{grid-template-columns:minmax(0,1fr) auto;gap:.35rem .65rem}.tc-history .tc-meter{grid-column:1/-1;grid-row:2}.tc-results-track-header{align-items:flex-start}.tc-results-rank{grid-template-columns:2.5rem minmax(0,1fr) auto;gap:.55rem;padding:.8rem .15rem}.tc-results-rank-number{width:2.1rem;height:2.1rem}.tc-results-meter{width:100%}.tc-results-breakdown{grid-column:2/-1}.tc-results-score{grid-column:3;grid-row:1;align-self:start}}
</style>
