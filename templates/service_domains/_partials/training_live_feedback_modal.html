<div class="modal fade" id="training-feedback-qr-modal" tabindex="-1" aria-labelledby="feedback-qr-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">
      <div class="modal-header">
        <h5 class="modal-title" id="feedback-qr-title">Attendee Mobile Feedback</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <p class="text-muted small mb-3">
          Participants scan with their mobile devices to submit anonymous comprehension and pace ratings.
        </p>
        <div class="p-3 bg-white rounded border d-inline-block mb-3 shadow-sm">
          <i class="bi bi-qr-code display-1 text-primary" aria-hidden="true"></i>
        </div>
        <div class="mt-2">
          <label class="small text-muted d-block mb-1">Feedback URL:</label>
          <input type="text" class="form-control form-control-sm text-center" value="{% url 'training_anonymous_feedback' feedback_public_id=session.feedback_public_id %}" readonly onclick="this.select();">
        </div>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-primary btn-sm" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
