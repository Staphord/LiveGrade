<script nonce="{{ csp_nonce }}">
(function () {
  document.addEventListener('click', function (event) {
    const row = event.target.closest('tr[data-coassessment-row-href]');
    if (!row || event.defaultPrevented || event.button !== 0) return;
    if (event.target.closest('a,button,form,input,select,textarea,label,summary,.coassessment-actions,[data-bs-toggle]')) return;
    const href = row.dataset.coassessmentRowHref;
    if (href) window.location.assign(href);
  });
})();
</script>
