<style nonce="{{ csp_nonce }}">
.custom-select-wrap{position:relative;width:100%}
.custom-select-native{position:absolute!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;border:0!important;pointer-events:none}
.custom-select-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);text-align:left;background-color:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-control);padding:.375rem .75rem;font-size:var(--fs-body);line-height:1.5;transition:border-color var(--motion-fast),box-shadow var(--motion-fast)}
.custom-select-trigger:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 .2rem var(--accent-soft)}
.custom-select-trigger:disabled{background-color:var(--surface-sunken);opacity:.65;cursor:not-allowed}
.custom-select-trigger .cst-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
.custom-select-trigger .cst-arrow{flex:0 0 auto;width:.75rem;height:.75rem;color:var(--text-muted);transition:transform var(--motion-fast)}
.custom-select-wrap.is-open .cst-arrow{transform:rotate(180deg)}
.custom-select-menu{position:absolute;z-index:var(--z-dropdown,1050);top:calc(100% + 4px);left:0;right:0;max-height:280px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--elev-3);padding:var(--sp-1);display:none;margin:0;list-style:none}
.custom-select-wrap.is-open .custom-select-menu{display:block;animation:dd-pop var(--motion) var(--ease)}
.custom-select-group{padding:var(--sp-2) var(--sp-3) var(--sp-1);font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700}
.custom-select-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border:0;border-radius:var(--radius-control);background:transparent;color:var(--text);font-size:var(--fs-body);text-align:left;cursor:pointer;user-select:none}
.custom-select-option:hover,.custom-select-option:focus-visible,.custom-select-option.is-highlighted{background:var(--surface-hover);outline:none}
.custom-select-option[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.custom-select-option[aria-selected="true"]::after{content:"✓";color:var(--accent);font-weight:700}
.custom-select-option:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
</style>
<script nonce="{{ csp_nonce }}">
(function(){
  function initSelect(select){
    if(!select||select.dataset.customSelectReady||select.multiple||select.size>1||select.dataset.nativeSelect)return;
    select.dataset.customSelectReady='true';
    select.classList.add('custom-select-native');
    select.tabIndex=-1;
    select.setAttribute('aria-hidden','true');

    const wrapper=document.createElement('div');
    wrapper.className='custom-select-wrap';

    const trigger=document.createElement('button');
    trigger.type='button';
    trigger.className='custom-select-trigger form-select text-start';
    trigger.id=(select.id?select.id+'-cst-btn':'cst-btn-'+Math.random().toString(36).slice(2,8));
    trigger.setAttribute('aria-haspopup','listbox');
    trigger.setAttribute('aria-expanded','false');
    if(select.disabled)trigger.disabled=true;

    const labelSpan=document.createElement('span');
    labelSpan.className='cst-text';
    trigger.appendChild(labelSpan);

    const menu=document.createElement('div');
    menu.className='custom-select-menu';
    menu.id=trigger.id+'-menu';
    menu.setAttribute('role','listbox');
    trigger.setAttribute('aria-controls',menu.id);

    Array.from(select.labels||[]).forEach(label=>{
      if(label.htmlFor===select.id)label.htmlFor=trigger.id;
    });

    select.before(wrapper);
    wrapper.append(select,trigger,menu);

    function syncOptions(){
      menu.innerHTML='';
      const children=Array.from(select.children);
      children.forEach(child=>{
        if(child.tagName.toLowerCase()==='optgroup'){
          const groupHeader=document.createElement('div');
          groupHeader.className='custom-select-group';
          groupHeader.textContent=child.label;
          menu.appendChild(groupHeader);
          Array.from(child.children).forEach(option=>buildOption(option));
        }else if(child.tagName.toLowerCase()==='option'){
          buildOption(child);
        }
      });
      syncSelection();
    }

    function buildOption(option){
      if(option.value===''&&select.hasAttribute('data-hide-empty-option'))return;
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='custom-select-option';
      btn.setAttribute('role','option');
      btn.dataset.value=option.value;
      btn.textContent=option.textContent;
      if(option.disabled)btn.disabled=true;
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        if(option.disabled)return;
        select.value=option.value;
        select.dispatchEvent(new Event('change',{bubbles:true}));
        select.dispatchEvent(new Event('input',{bubbles:true}));
        syncSelection();
        closeMenu(true);
      });
      btn.addEventListener('keydown',function(e){
        handleOptionKeydown(e,btn);
      });
      menu.appendChild(btn);
    }

    function syncSelection(){
      const selectedOption=select.options[select.selectedIndex];
      labelSpan.textContent=selectedOption?selectedOption.textContent:'';
      menu.querySelectorAll('[role="option"]').forEach(btn=>{
        const isSelected=(btn.dataset.value===select.value);
        btn.setAttribute('aria-selected',isSelected?'true':'false');
      });
      trigger.disabled=select.disabled;
    }

    function openMenu(){
      if(select.disabled)return;
      wrapper.classList.add('is-open');
      trigger.setAttribute('aria-expanded','true');
      const selectedBtn=menu.querySelector('[aria-selected="true"]:not(:disabled)')||menu.querySelector('[role="option"]:not(:disabled)');
      if(selectedBtn){
        selectedBtn.focus();
        highlight(selectedBtn);
      }
    }

    function closeMenu(focusTrigger){
      wrapper.classList.remove('is-open');
      trigger.setAttribute('aria-expanded','false');
      if(focusTrigger)trigger.focus();
    }

    function highlight(btn){
      menu.querySelectorAll('[role="option"]').forEach(el=>el.classList.remove('is-highlighted'));
      if(btn)btn.classList.add('is-highlighted');
    }

    function handleOptionKeydown(e,currentBtn){
      const enabledOptions=Array.from(menu.querySelectorAll('[role="option"]:not(:disabled)'));
      const index=enabledOptions.indexOf(currentBtn);
      if(e.key==='ArrowDown'){
        e.preventDefault();
        const next=enabledOptions[(index+1)%enabledOptions.length];
        next.focus();
        highlight(next);
      }else if(e.key==='ArrowUp'){
        e.preventDefault();
        const prev=enabledOptions[(index-1+enabledOptions.length)%enabledOptions.length];
        prev.focus();
        highlight(prev);
      }else if(e.key==='Home'){
        e.preventDefault();
        if(enabledOptions.length){enabledOptions[0].focus();highlight(enabledOptions[0]);}
      }else if(e.key==='End'){
        e.preventDefault();
        if(enabledOptions.length){enabledOptions[enabledOptions.length-1].focus();highlight(enabledOptions[enabledOptions.length-1]);}
      }else if(e.key==='Escape'){
        e.preventDefault();
        closeMenu(true);
      }else if(e.key==='Tab'){
        closeMenu(false);
      }
    }

    trigger.addEventListener('click',function(e){
      e.stopPropagation();
      if(wrapper.classList.contains('is-open'))closeMenu(false);
      else openMenu();
    });

    trigger.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key===' '){
        e.preventDefault();
        openMenu();
      }else if(e.key==='Escape'){
        closeMenu(false);
      }
    });

    document.addEventListener('click',function(e){
      if(!wrapper.contains(e.target))closeMenu(false);
    });

    select.addEventListener('change',syncSelection);
    if(select.form){
      select.form.addEventListener('reset',function(){
        setTimeout(syncSelection,0);
      });
    }

    syncOptions();
  }

  window.initCustomSelects=function(root){
    const container=root||document;
    container.querySelectorAll('select.form-select:not([multiple]):not([size]):not([data-native-select])').forEach(initSelect);
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){window.initCustomSelects();});
  }else{
    window.initCustomSelects();
  }
})();
</script>
