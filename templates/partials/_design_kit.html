<style>
/* ==========================================================================
   DevPerf kit — the shared components built on the tokens in
   _design_system.html. Tokens live there; this file only composes them.
   Live reference: /design-kit/ (superusers).
   ========================================================================== */

/* Small utilities used by the pages ------------------------------------- */
.pre-line{white-space:pre-line}
.lh-relaxed{line-height:1.7}
.row-overdue > td{background:color-mix(in srgb,var(--danger) 6%,var(--surface))}
.kbd{display:inline-block;min-width:1.5em;padding:1px var(--sp-1);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:var(--radius-xs);background:var(--surface);color:var(--text-soft);font:600 var(--fs-micro)/1.4 var(--font-ui);text-align:center}

/* F-1 Data table ------------------------------------------------------------
   Convention from CLAUDE.md: a scroll box (max-height 32rem), sticky header,
   table-sm, pager in a card-footer. Use: <div class="table-responsive dt-scroll"> */
.dt-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-3) var(--card-pad);border-bottom:1px solid var(--border)}
.dt-toolbar .dt-spacer{flex:1}
.dt-search{position:relative;flex:0 1 260px}
.dt-search i{position:absolute;left:var(--sp-3);top:50%;transform:translateY(-50%);color:var(--text-subtle);pointer-events:none}
.dt-search .form-control{padding-left:calc(var(--sp-3) * 2 + var(--sp-2))}
.dt-scroll{max-height:32rem;overflow:auto;position:relative}
.dt-scroll thead th{position:sticky;top:0;z-index:var(--z-base);box-shadow:inset 0 -1px 0 var(--border)}
.dt-sort{display:inline-flex;align-items:center;gap:var(--sp-1);color:inherit;text-decoration:none;white-space:nowrap}
.dt-sort i{opacity:.35;transition:opacity var(--motion-fast) var(--ease),transform var(--motion-fast) var(--ease)}
.dt-sort:hover i{opacity:.8}
.dt-sort.is-active{color:var(--ink)}
.dt-sort.is-active i{opacity:1;color:var(--accent)}
.dt-sort.is-desc i{transform:rotate(180deg)}
.dt-check{width:36px;padding-right:0!important}
.dt tbody tr{transition:background var(--motion-fast) var(--ease)}
.dt tbody tr:hover{background:var(--surface-hover)}
.dt tbody tr.is-selected > td{background:var(--accent-soft)}
.dt-actions{display:inline-flex;gap:var(--sp-1);opacity:0;transition:opacity var(--motion-fast) var(--ease)}
.dt tbody tr:hover .dt-actions,.dt tbody tr:focus-within .dt-actions{opacity:1}
@media (hover:none){.dt-actions{opacity:1}}
.dt-actions .btn{padding:2px var(--sp-2)}
.dt-bulkbar{display:none;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--card-pad);background:var(--accent-soft);color:var(--accent);border-bottom:1px solid var(--border);font-weight:600;font-size:var(--fs-body)}
.dt-bulkbar.show{display:flex;animation:dt-bulk-in var(--motion) var(--ease)}
.dt-bulkbar .dt-bulk-actions{display:flex;gap:var(--sp-2);margin-left:auto}
@keyframes dt-bulk-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.dt-cols .dropdown-menu{min-width:200px;padding:var(--sp-2)}
.dt-cols label{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-2);border-radius:var(--radius-xs);cursor:pointer;font-size:var(--fs-body)}
.dt-cols label:hover{background:var(--surface-hover)}
.dt-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.dt-perpage{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--text-muted)}
.dt-perpage .form-select{width:auto}
/* The "n of N" indicator between the arrows: information, not a control, so
   it reads as plain text rather than a fourth (disabled-looking) button. */
.dt-jump .page-link{background:transparent;border-color:transparent;color:var(--text-muted);pointer-events:none}

/* F-2 Page header + tabs ------------------------------------------------- */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-1);font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:var(--sp-1)}
.crumbs a{color:inherit;text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.crumbs .crumb-sep{color:var(--text-subtle)}
.page-header .page-header-main{min-width:0}
.page-header .page-title-row{display:flex;align-items:center;gap:var(--sp-2)}
.page-header .page-title{overflow-wrap:anywhere}
.page-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2)}
.pin-btn{border:0;background:transparent;color:var(--text-subtle);padding:2px;border-radius:var(--radius-xs);line-height:1;transition:color var(--motion-fast) var(--ease),transform var(--motion-fast) var(--ease)}
.pin-btn:hover{color:var(--warn);transform:scale(1.15)}
.pin-btn.is-pinned{color:var(--warn)}
.page-tabs{display:flex;gap:var(--sp-5);border-bottom:1px solid var(--border);margin:calc(var(--sp-2) * -1) 0 var(--sp-5);overflow-x:auto;scrollbar-width:none}
.page-tabs::-webkit-scrollbar{display:none}
.page-tab{position:relative;display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-2) 0 var(--sp-3);color:var(--text-muted);font-size:var(--fs-body);text-decoration:none;white-space:nowrap;transition:color var(--motion-fast) var(--ease)}
.page-tab:hover{color:var(--ink)}
.page-tab.active{color:var(--ink);font-weight:600}
.page-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:var(--radius-pill);background:var(--accent);transform-origin:left;animation:tab-grow var(--motion) var(--ease)}
.page-tab .count{font-size:var(--fs-micro);font-weight:600;padding:0 var(--sp-2);border-radius:var(--radius-pill);background:var(--border);color:var(--text-soft)}
.page-tab.active .count{background:var(--accent-soft);color:var(--accent)}
@keyframes tab-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:768px){
.page-header{flex-direction:column;align-items:stretch;margin-bottom:var(--sp-4)}
.page-header-actions{flex-wrap:wrap}
.page-tabs{gap:var(--sp-4)}
}

/* F-2b Sticky tab header — an opt-in wrapper (not baked into .page-tabs
   itself, so unrelated pages that already use tabs keep their normal,
   non-sticky layout). Pins the session sub-nav under the topbar as the
   page scrolls, with a compact KPI strip pinned along with it when a page
   has one, instead of both scrolling out of view immediately. */
.tabs-sticky-header{position:sticky;top:var(--topbar-h);z-index:var(--z-sticky);
     background:var(--canvas);padding-top:var(--sp-3);margin:calc(var(--sp-3) * -1) calc(var(--page-gutter) * -1) 0;
     padding-left:var(--page-gutter);padding-right:var(--page-gutter);padding-bottom:var(--sp-3)}
.tabs-sticky-header .page-tabs{margin-bottom:0}
.tabs-sticky-header > *:not(:last-child){margin-bottom:var(--sp-3)}

/* Shared stat-pill strip — a quick at-a-glance KPI row, originally built for
   the Groups tab and reused (with an added is-bad tone + optional filter-link
   affordance) on Participation, so both "overview strip" instances share one
   definition instead of drifting apart. */
.groups-stat-strip{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
.groups-stat-pill{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--border);
     border-radius:var(--radius-card);padding:.6rem .9rem;flex:1;min-width:140px}
.groups-stat-pill .stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
     justify-content:center;background:var(--accent-soft);color:var(--accent);font-size:1rem;flex-shrink:0}
.groups-stat-pill.is-warn .stat-icon{background:var(--tone-warn-bg);color:var(--tone-warn-fg)}
.groups-stat-pill.is-ok .stat-icon{background:var(--tone-success-bg);color:var(--tone-success-fg)}
.groups-stat-pill.is-bad .stat-icon{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
.groups-stat-pill .stat-val{font-size:var(--fs-heading);font-weight:800;color:var(--ink);line-height:1.1}
.groups-stat-pill .stat-val .stat-of{font-size:var(--fs-sm);font-weight:600;color:var(--text-muted)}
.groups-stat-pill .stat-lbl{font-size:var(--fs-micro);color:var(--text-muted)}
/* A stat pill that doubles as a filter link — same shape, plus a hover lift
   and an active ring so the current filter reads clearly among the four. */
a.groups-stat-pill.filter-pill{text-decoration:none;cursor:pointer;transition:transform var(--motion-fast) var(--ease),box-shadow var(--motion-fast) var(--ease)}
a.groups-stat-pill.filter-pill:hover{transform:translateY(-1px);box-shadow:var(--elev-1)}
a.groups-stat-pill.filter-pill.is-active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft) inset}

/* A small initials avatar gives every row a distinct visual anchor to
   scan by, the way a real roster/contacts list (not a bare spreadsheet
   dump) would — Bootstrap's own "subtle" tone classes cycle per row so no
   new colour tokens are needed. Originally built for the Roster tab, now
   shared with Results' student column for the same at-a-glance feel. */
.roster-avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
     font-weight:700;font-size:.7rem;flex-shrink:0;letter-spacing:.02em}
.roster-name-cell{display:flex;align-items:center;gap:.6rem}

/* F-3 Command palette + shortcuts overlay --------------------------------- */
.cp-backdrop{position:fixed;inset:0;z-index:var(--z-modal);background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh var(--sp-4) var(--sp-4);animation:cp-fade var(--motion-fast) var(--ease)}
.cp-backdrop[hidden]{display:none}
.cp-panel{width:min(var(--palette-w),100%);background:var(--surface);border-radius:var(--radius-card-lg);box-shadow:var(--elev-4);overflow:hidden;animation:cp-in var(--motion) var(--ease)}
.cp-search{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4);border-bottom:1px solid var(--border)}
.cp-search i{color:var(--text-muted);font-size:var(--icon-md)}
.cp-input{flex:1;border:0;outline:0;background:transparent;font-size:var(--fs-heading);color:var(--ink);min-width:0}
.cp-input::placeholder{color:var(--text-subtle)}
.cp-list{max-height:min(50vh,420px);overflow-y:auto;padding:var(--sp-2)}
.cp-group{padding:var(--sp-3) var(--sp-3) var(--sp-1)}
.cp-item{display:flex;align-items:center;gap:var(--sp-3);width:100%;padding:var(--sp-2) var(--sp-3);border:0;background:transparent;border-radius:var(--radius-control);text-align:left;color:var(--text);font-size:var(--fs-strong);cursor:pointer}
.cp-item i{width:20px;text-align:center;color:var(--text-muted)}
.cp-item .cp-hint{margin-left:auto;color:var(--text-muted);font-size:var(--fs-sm)}
.cp-item mark{background:transparent;color:var(--accent);font-weight:700}
.cp-item.is-active{background:var(--accent-soft)}
.cp-item.is-active i{color:var(--accent)}
.cp-empty{padding:var(--sp-6) var(--sp-4);text-align:center;color:var(--text-muted);font-size:var(--fs-body)}
.cp-ai{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);background:var(--surface-hover);font-size:var(--fs-body);color:var(--text-soft)}
.cp-ai[hidden]{display:none}
.cp-foot{display:flex;flex-wrap:wrap;gap:var(--sp-4);padding:var(--sp-2) var(--sp-4);border-top:1px solid var(--border);background:var(--surface-hover);font-size:var(--fs-micro);color:var(--text-muted)}
.cp-foot span{display:inline-flex;align-items:center;gap:var(--sp-1)}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--sp-5);padding:var(--sp-4) var(--sp-5) var(--sp-5)}
.sc-group h6{margin:0 0 var(--sp-2)}
.sc-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-1) 0;font-size:var(--fs-body)}
.sc-row .keys{display:inline-flex;gap:var(--sp-1);align-items:center;color:var(--text-muted)}
@keyframes cp-fade{from{opacity:0}to{opacity:1}}
@keyframes cp-in{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.nav-search{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-3) var(--sp-3) var(--sp-1);padding:var(--sp-2) var(--sp-3);border:1px solid var(--border-strong);border-radius:var(--radius-control);background:var(--surface-hover);color:var(--text-muted);font-size:var(--fs-body);cursor:pointer;width:calc(100% - var(--sp-3) * 2);text-align:left;transition:border-color var(--motion-fast) var(--ease),background var(--motion-fast) var(--ease)}
.nav-search:hover{border-color:var(--accent);background:var(--surface)}
.nav-search .kbd{margin-left:auto}
.sidebar.collapsed .nav-search{justify-content:center;margin-inline:var(--sp-2);width:calc(100% - var(--sp-2) * 2);padding-inline:0}
.sidebar.collapsed .nav-search .nav-search-text,.sidebar.collapsed .nav-search .kbd{display:none}

/* F-4 Skeletons ------------------------------------------------------------ */
.sk{background:linear-gradient(90deg,var(--skeleton-base) 25%,var(--skeleton-shine) 50%,var(--skeleton-base) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s linear infinite;border-radius:var(--radius-xs)}
.sk-line{height:.75em;margin-bottom:var(--sp-2)}
.sk-line.sk-title{height:1.1em;width:40%;margin-bottom:var(--sp-3)}
.sk-block{height:120px;border-radius:var(--radius-card)}
.sk-pill{height:1.4em;width:64px;border-radius:var(--radius-pill)}
.sk-avatar{width:32px;height:32px;border-radius:var(--radius-pill);flex-shrink:0}
.sk-row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--row-pad-y) var(--row-pad-x);border-bottom:1px solid var(--border)}
.sk-row:last-child{border-bottom:0}
.sk-row .sk-line{flex:1;margin:0}
@keyframes sk-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* F-5 Inline edit ---------------------------------------------------------- */
.ie{display:inline-block;cursor:pointer;border-radius:var(--radius-xs);padding:0 var(--sp-1);margin:0 calc(var(--sp-1) * -1);transition:background var(--motion-fast) var(--ease),box-shadow var(--motion-fast) var(--ease)}
.ie:hover,.ie:focus-visible{background:var(--surface-hover);box-shadow:inset 0 0 0 1px var(--border-strong)}
.ie.is-empty{color:var(--text-subtle);font-style:italic}
.ie.is-saving{opacity:var(--disabled-opacity);pointer-events:none}
.ie.is-saved{animation:ie-saved 900ms var(--ease)}
@keyframes ie-saved{0%{background:var(--tone-success-bg)}100%{background:transparent}}
.ie-pop{position:absolute;z-index:var(--z-dropdown);min-width:240px;max-width:min(360px,calc(100vw - var(--sp-5)));padding:var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--elev-3);animation:ie-pop-in var(--motion-fast) var(--ease)}
.ie-pop .ie-label{display:block;margin-bottom:var(--sp-1)}
.ie-pop .ie-actions{display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-2);margin-top:var(--sp-3)}
.ie-pop .ie-actions .u-meta{margin-right:auto}
.ie-pop .ie-error{margin-top:var(--sp-2)}
.ie-options{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow-y:auto;margin:0 calc(var(--sp-2) * -1)}
.ie-option{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border:0;background:transparent;border-radius:var(--radius-control);text-align:left;font-size:var(--fs-body);color:var(--text)}
.ie-option:hover,.ie-option:focus-visible{background:var(--surface-hover)}
.ie-option.is-selected{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ie-option .bi-check2{margin-left:auto;visibility:hidden}
.ie-option.is-selected .bi-check2{visibility:visible}
@keyframes ie-pop-in{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

/* Catch me up (A4) ----------------------------------------------------------
   The facts under the brief are records, so they are styled as records:
   solid rows, tone only on the edge. The dashed AI surface is for the brief. */
.cu-group{margin-top:var(--sp-4)}
.cu-group-title{font-size:var(--fs-micro);font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin:0 0 var(--sp-1)}
.cu-group-hint{font-size:var(--fs-sm);color:var(--text-muted);margin:0 0 var(--sp-2)}
.cu-section{border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);margin-bottom:var(--sp-2);overflow:hidden}
.cu-section-head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);font-weight:600;color:var(--ink);border-bottom:1px solid var(--border)}
.cu-section-title{flex:1;min-width:0}
.cu-count{font-size:var(--fs-micro);font-weight:600;color:var(--text-muted);background:var(--tone-neutral-bg);border-radius:var(--radius-pill);padding:1px var(--sp-2)}
.cu-list{list-style:none;margin:0;padding:0}
.cu-list li + li{border-top:1px solid var(--border)}
.cu-item{display:flex;flex-direction:column;gap:2px;padding:var(--sp-2) var(--sp-3);border-left:3px solid transparent;color:var(--text);text-decoration:none;transition:background var(--motion-fast) var(--ease)}
a.cu-item:hover,a.cu-item:focus-visible{background:var(--surface-hover);color:var(--text)}
.cu-item.cu-warn{border-left-color:var(--tone-warn-fg)}
.cu-item.cu-danger{border-left-color:var(--tone-danger-fg)}
.cu-label{overflow-wrap:anywhere}
.cu-label .bi{font-size:var(--fs-micro);color:var(--text-muted)}
.cu-detail{font-size:var(--fs-sm);color:var(--text-muted)}
.cu-danger .cu-detail{color:var(--tone-danger-fg)}
.cu-more{display:block;padding:var(--sp-1) var(--sp-3) var(--sp-2);font-size:var(--fs-sm);color:var(--text-muted)}
a.cu-more:hover{color:var(--accent)}
.cu-page{max-width:720px}

/* F-6 Drawer + confirm dialog ---------------------------------------------- */
.dp-drawer{--bs-offcanvas-width:var(--drawer-w);--bs-offcanvas-bg:var(--surface);--bs-offcanvas-border-color:var(--border);--bs-offcanvas-box-shadow:var(--elev-4);--bs-offcanvas-transition:transform var(--motion) var(--ease);max-width:100vw}
.dp-drawer.dp-drawer-lg{--bs-offcanvas-width:var(--drawer-w-lg)}
.dp-drawer .offcanvas-header{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border)}
.dp-drawer .dp-drawer-title{flex:1;min-width:0;margin:0;font-size:var(--fs-heading);font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-drawer .offcanvas-body{padding:var(--sp-4)}
.dp-drawer .dp-drawer-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);background:var(--surface);border-top:1px solid var(--border)}
.dp-drawer .dp-peek-hide{display:none}
.offcanvas-backdrop.show{opacity:1;background:var(--scrim)}
.dp-modal .modal-dialog{max-width:520px}
.dp-modal .modal-header{padding:var(--sp-4);border-bottom:1px solid var(--border)}
.dp-modal .modal-body{padding:var(--sp-4)}
.dp-modal .modal-footer{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);gap:var(--sp-2)}
.dp-confirm .dp-confirm-icon{width:40px;height:40px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;font-size:var(--icon-md);background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.dp-confirm.is-danger .dp-confirm-icon{background:var(--tone-danger-bg);color:var(--tone-danger-fg)}
.modal.fade .modal-dialog{transition:transform var(--motion) var(--ease)}

/* F-8 Sidebar frame --------------------------------------------------------- */
.nav-section.nav-group-toggle{display:flex;align-items:center;gap:var(--sp-1);width:calc(100% - var(--sp-4));margin-inline:var(--sp-2);border:0;background:transparent;text-align:left;border-radius:var(--radius-xs);cursor:pointer;padding:var(--sp-1) var(--sp-2)}
.nav-section.nav-group-toggle:hover{background:var(--surface-hover);color:var(--text-muted)}
.nav-group-toggle .nav-caret{margin-left:auto;font-size:var(--fs-micro);transition:transform var(--motion) var(--ease)}
.nav-group.is-collapsed .nav-caret{transform:rotate(-90deg)}
.nav-group-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--motion) var(--ease)}
.nav-group-body > .nav-group-inner{overflow:hidden;min-height:0}
.nav-group.is-collapsed .nav-group-body{grid-template-rows:0fr}
.sidebar.collapsed .nav-group.is-collapsed .nav-group-body{grid-template-rows:1fr}
.sidebar.collapsed .nav-group-toggle .nav-caret{display:none}
.nav-badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-pill);background:var(--danger);color:var(--surface);font-size:var(--fs-micro);font-weight:700;line-height:18px;text-align:center}
.sidebar.collapsed .nav-badge{position:absolute;top:2px;right:6px;min-width:8px;height:8px;padding:0;font-size:0;line-height:0}
.nav-link{position:relative}
.nav-mini{display:flex;align-items:center;gap:var(--sp-2);margin:1px var(--sp-2);padding:var(--sp-1) var(--sp-2);border-radius:var(--radius-control);color:var(--text-soft);font-size:var(--fs-sm);text-decoration:none;transition:background var(--motion-fast) var(--ease)}
.nav-mini:hover{background:var(--surface-hover);color:var(--text)}
.nav-mini.active{background:var(--accent-soft);color:var(--accent)}
.nav-mini i{font-size:var(--fs-sm);color:var(--text-subtle)}
.nav-mini .nav-mini-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
