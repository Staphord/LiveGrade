<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No access - LiveGrade</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
{% include 'partials/_design_system.html' %}
<style>
:root{--na-night:#0f2a4d;--na-deep:#123c6e;--na-mint:#2fd4b0;--na-sun:#ffd166;--na-violet:#7c5cff}
body{margin:0;min-height:100vh;color:#fff;font-size:1rem}
.na-stage{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(900px 520px at 86% 8%,rgba(124,92,255,.38),transparent 60%),
    radial-gradient(720px 480px at 6% 94%,rgba(47,212,176,.24),transparent 60%),
    linear-gradient(135deg,var(--na-night) 0%,var(--na-deep) 48%,#1f5fc4 100%)}
.na-orb{position:absolute;border-radius:50%;pointer-events:none;border:1px solid rgba(255,255,255,.13)}
.na-orb-1{width:560px;height:560px;right:-190px;top:-210px}
.na-orb-2{width:350px;height:350px;right:-95px;top:-115px}
.na-orb-3{width:300px;height:300px;left:-130px;bottom:110px;border:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.13),rgba(255,255,255,0) 70%)}
.na-shape{position:absolute;pointer-events:none;z-index:1}
.na-s-a{width:440px;height:440px;left:-150px;top:-170px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle at 60% 60%,rgba(255,255,255,.10),rgba(255,255,255,0) 68%)}
.na-s-b{width:150px;height:150px;left:7%;top:44%;border-radius:50%;border:2px solid rgba(47,212,176,.38)}
.na-s-c{width:230px;height:230px;right:5%;top:50%;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(124,92,255,.42),rgba(124,92,255,0) 70%)}
.na-s-d{width:420px;height:420px;right:-150px;bottom:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(47,212,176,.26),rgba(47,212,176,0) 68%)}
.na-s-e{width:132px;height:132px;left:15%;top:15%;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.55) 1.6px,transparent 1.8px);background-size:22px 22px}
.na-s-f{width:132px;height:132px;right:15%;bottom:27%;opacity:.4;background-image:radial-gradient(rgba(255,255,255,.55) 1.6px,transparent 1.8px);background-size:22px 22px}
.na-s-g{width:150px;height:150px;right:30%;top:11%;border-radius:38px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,0));--rot:18deg;transform:rotate(var(--rot))}
.na-s-h{width:120px;height:120px;left:16%;bottom:12%;border-radius:32px;border:1px solid rgba(255,209,102,.35);--rot:-14deg;transform:rotate(var(--rot))}
.na-dot{position:absolute;border-radius:50%;pointer-events:none;z-index:1}
.na-dot-1{width:16px;height:16px;left:22%;top:63%;background:var(--na-sun);opacity:.85}
.na-dot-2{width:12px;height:12px;right:24%;top:30%;background:var(--na-mint);opacity:.9}
.na-dot-3{width:10px;height:10px;left:9%;top:24%;background:#fff;opacity:.6}
.na-dot-4{width:14px;height:14px;right:9%;bottom:30%;background:var(--na-violet);opacity:.9}
.na-nav{position:relative;z-index:2;padding:1.2rem 0}
.na-brand{display:inline-flex;align-items:center;gap:.6rem;color:#fff;text-decoration:none}
.na-brand-mark{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:1.2rem;backdrop-filter:blur(6px)}
.na-brand-name{font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.na-main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem 1rem 9rem}
.na-content{width:100%;max-width:38rem}
.na-seal{position:relative;width:96px;height:96px;margin:0 auto 1.8rem;display:flex;align-items:center;justify-content:center}
.na-seal::before,.na-seal::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.22)}
.na-seal::before{inset:-16px}
.na-seal::after{inset:-34px;border-color:rgba(255,255,255,.11)}
.na-seal i{position:relative;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:#fff;background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);box-shadow:0 20px 44px rgba(5,20,45,.4);backdrop-filter:blur(8px)}
.na-eyebrow{display:inline-flex;align-items:center;gap:.5rem;padding:.38rem .95rem;border-radius:var(--radius-pill);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.na-eyebrow i{color:var(--na-sun)}
.na-content h1{font-size:clamp(2rem,5.4vw,3.2rem);line-height:1.1;font-weight:800;letter-spacing:-.03em;margin:1.2rem 0 0;text-wrap:balance}
.na-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem;margin-top:2.4rem}
.na-actions form{margin:0}
.na-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.7rem;border-radius:var(--radius-pill);font-weight:700;font-size:1.02rem;line-height:1.2;text-decoration:none;cursor:pointer;transition:transform var(--motion-fast) var(--ease),background var(--motion-fast) var(--ease),box-shadow var(--motion-fast) var(--ease)}
.na-btn-solid{background:#fff;color:var(--na-deep);border:1px solid #fff;box-shadow:0 10px 26px rgba(8,26,56,.32)}
.na-btn-solid:hover,.na-btn-solid:focus{background:var(--na-sun);border-color:var(--na-sun);color:var(--na-night);transform:translateY(-1px)}
.na-btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.na-btn-ghost:hover,.na-btn-ghost:focus{background:rgba(255,255,255,.14);border-color:#fff;color:#fff;transform:translateY(-1px)}
.na-wave{position:absolute;left:0;bottom:-1px;width:100%;line-height:0;pointer-events:none}
.na-wave svg{display:block;width:100%;height:clamp(70px,11vw,150px)}
@keyframes na-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes na-drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,18px) scale(1.07)}}
@keyframes na-drift-alt{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,-16px) scale(1.06)}}
@keyframes na-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes na-bob-tilt{0%,100%{transform:translateY(0) rotate(var(--rot))}50%{transform:translateY(-18px) rotate(calc(var(--rot) + 9deg))}}
@keyframes na-ring{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.1);opacity:.45}}
@keyframes na-halo{0%{transform:scale(.94);opacity:.9}100%{transform:scale(1.16);opacity:0}}
@keyframes na-twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
@keyframes na-grid{from{background-position:0 0}to{background-position:22px 22px}}
@keyframes na-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.22)}}
.na-seal{animation:na-rise .8s var(--ease) both}
.na-eyebrow{animation:na-rise .8s var(--ease) .12s both}
.na-content h1{animation:na-rise .85s var(--ease) .22s both}
.na-actions{animation:na-rise .85s var(--ease) .34s both}
.na-seal::before{animation:na-halo 3.2s ease-out infinite}
.na-seal::after{animation:na-halo 3.2s ease-out 1.1s infinite}
.na-seal i{animation:na-bob 5s ease-in-out infinite}
.na-orb-1{animation:na-drift 22s ease-in-out infinite}
.na-orb-2{animation:na-drift-alt 26s ease-in-out infinite}
.na-orb-3{animation:na-drift 20s ease-in-out -6s infinite}
.na-s-a{animation:na-drift 24s ease-in-out infinite}
.na-s-b{animation:na-ring 5.5s ease-in-out infinite}
.na-s-c{animation:na-drift-alt 18s ease-in-out infinite}
.na-s-d{animation:na-drift 28s ease-in-out -9s infinite}
.na-s-e{animation:na-grid 9s linear infinite}
.na-s-f{animation:na-grid 12s linear infinite reverse}
.na-s-g{animation:na-bob-tilt 9s ease-in-out infinite}
.na-s-h{animation:na-bob-tilt 11s ease-in-out -4s infinite}
.na-dot-1{animation:na-bob 6s ease-in-out infinite,na-twinkle 3.4s ease-in-out infinite}
.na-dot-2{animation:na-bob 7s ease-in-out -2s infinite,na-twinkle 2.8s ease-in-out -1s infinite}
.na-dot-3{animation:na-twinkle 3.1s ease-in-out -0.5s infinite}
.na-dot-4{animation:na-bob 5.5s ease-in-out -3s infinite,na-twinkle 3.6s ease-in-out -2s infinite}
.na-wave svg path:first-child{transform-box:fill-box;transform-origin:50% 100%;animation:na-breathe 7s ease-in-out infinite}
@media (max-width:767px){
  .na-s-e,.na-s-f,.na-s-g,.na-s-h,.na-s-b{display:none}
  .na-s-c{width:150px;height:150px;right:-30px}
}
@media (max-width:575px){
  .na-dot-4{display:none}
  .na-main{padding-bottom:7rem}
  .na-actions{flex-direction:column}
  .na-actions form,.na-btn{width:100%}
  .na-actions form .na-btn{width:100%}
}
</style>
</head>
<body>
<div class="na-stage">
  <span class="na-orb na-orb-1"></span><span class="na-orb na-orb-2"></span><span class="na-orb na-orb-3"></span>
  <span class="na-shape na-s-a" aria-hidden="true"></span><span class="na-shape na-s-b" aria-hidden="true"></span>
  <span class="na-shape na-s-c" aria-hidden="true"></span><span class="na-shape na-s-d" aria-hidden="true"></span>
  <span class="na-shape na-s-e" aria-hidden="true"></span><span class="na-shape na-s-f" aria-hidden="true"></span>
  <span class="na-shape na-s-g" aria-hidden="true"></span><span class="na-shape na-s-h" aria-hidden="true"></span>
  <span class="na-dot na-dot-1" aria-hidden="true"></span><span class="na-dot na-dot-2" aria-hidden="true"></span>
  <span class="na-dot na-dot-3" aria-hidden="true"></span><span class="na-dot na-dot-4" aria-hidden="true"></span>

  <header class="na-nav">
    <div class="container">
      <a class="na-brand" href="{% url 'home' %}">
        <span class="na-brand-mark"><i class="bi bi-clipboard2-data"></i></span>
        <span class="na-brand-name">LiveGrade</span>
      </a>
    </div>
  </header>

  <main class="na-main">
    <div class="na-content">
      <div class="na-seal"><i class="bi bi-person-lock"></i></div>
      <span class="na-eyebrow"><i class="bi bi-shield-lock-fill"></i>No access</span>
      <h1>LiveGrade is not available for this account</h1>

      <div class="na-actions">
        <form method="post" action="{% url 'switch_account' %}">
          {% csrf_token %}
          <button type="submit" class="na-btn na-btn-solid">Use a different account</button>
        </form>
        {% if not request.user.is_authenticated %}
        <a class="na-btn na-btn-ghost btn" href="{% url 'home' %}"><i class="bi bi-arrow-left"></i>Back to the home page</a>
        {% endif %}
      </div>
    </div>
  </main>

  <div class="na-wave"><svg viewBox="0 0 1440 140" preserveAspectRatio="none"><path fill="rgba(255,255,255,.14)" d="M0,50 C240,10 480,20 720,64 C960,108 1200,112 1440,52 L1440,140 L0,140 Z"/><path fill="#e8f1fc" d="M0,80 C260,130 520,130 760,80 C1000,30 1220,20 1440,70 L1440,140 L0,140 Z"/></svg></div>
</div>
<script>
(function () {
  var timer;
  function busy(el) {
    el.classList.add('is-busy');
    el.setAttribute('aria-busy', 'true');
    clearTimeout(timer);
    timer = setTimeout(reset, 15000);
  }
  function reset() {
    document.querySelectorAll('.is-busy').forEach(function (el) {
      el.classList.remove('is-busy');
      el.removeAttribute('aria-busy');
    });
    document.querySelectorAll('form[data-submitting]').forEach(function (form) {
      delete form.dataset.submitting;
    });
  }
  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (e.defaultPrevented) return;
    if (form.dataset.submitting) {
      e.preventDefault();
      return;
    }
    form.dataset.submitting = '1';
    var button = e.submitter || form.querySelector('[type="submit"]');
    if (button) busy(button);
  });
  document.addEventListener('click', function (e) {
    var link = e.target.closest && e.target.closest('a.btn[href]');
    if (!link || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    busy(link);
  });
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) reset();
  });
})();
</script>
</body>
</html>
